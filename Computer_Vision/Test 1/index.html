<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Body Pose Detection</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
  </head>
  <body>
    <script>
      let video;
      let handPose;
      let hands = [];
      let cameraStatus = 'Kamera wird initialisiert...';

      const OAK_CAMERA_LABEL_PATTERN = /(oak|depthai|luxonis)/i;

      // Game state: 'waiting' = warte auf Rechen-Hochheben, 'playing' = Spiel läuft
      let gameState = 'waiting';
      let waitingStartTime = 0;
      const MIN_WAIT_MS = 2000; // Screen wird mindestens 2 Sek. angezeigt

      // Rechen Farberkennung
      let rechenDetected = false;
      let rechenCX = null;
      let rechenCY = null;

      // Centroid-Bewegungserkennung für Spielstart
      // Prinzip: Centroid muss erst N Frames still sein (Referenz),
      // dann wird auf Bewegung > Schwellwert geprüft.
      let centroidHistory = [];
      const CENTROID_HISTORY_LEN = 10;  // Frames für Glättung
      let rechenStable = false;          // hat der Rechen lang genug still gelegen?
      let stillFrames = 0;
      const STILL_FRAMES_NEEDED = 25;   // ~0.8 Sek. Stille nötig bevor Bewegung geprüft wird
      const STILL_THRESHOLD = 3;        // max. Pixel/Frame Bewegung = "still"
      let refCX = null;
      let refCY = null;
      const MOVE_THRESHOLD = 20;        // Pixel Verschiebung von Referenz = "hochgehoben"

      // Web Serial API
      let serialWriter = null;
      let serialConnected = false;

      // Edge-detection state (nur beim Übergang auslösen)
      let prevTwoHands = false;
      let prevRechenDetected = false;
      const COOLDOWN = 1500;
      let lastCPress = -1500;
      let lastDPress = -1500;

      async function connectSerial() {
        if (!navigator.serial) {
          alert('Web Serial API nicht verfügbar. Bitte Chrome oder Edge verwenden.');
          return;
        }
        try {
          const port = await navigator.serial.requestPort();
          await port.open({ baudRate: 9600 });
          const encoder = new TextEncoderStream();
          encoder.readable.pipeTo(port.writable);
          serialWriter = encoder.writable.getWriter();
          serialConnected = true;
          connectBtn.html('✅ ESP32 verbunden');
          connectBtn.style('background', '#2a9d2a');
        } catch (e) {
          console.error('Serial Verbindung fehlgeschlagen:', e);
        }
      }

      async function sendSerial(char) {
        if (serialWriter) {
          try { await serialWriter.write(char); }
          catch (e) { console.error('Senden fehlgeschlagen:', e); }
        }
      }

      let connectBtn;

      function preload() {
        handPose = ml5.handPose();
      }

      async function findOakCameraDeviceId() {
        if (!navigator.mediaDevices?.enumerateDevices) {
          return null;
        }

        const devices = await navigator.mediaDevices.enumerateDevices();
        const camera = devices.find(
          (device) =>
            device.kind === 'videoinput' && OAK_CAMERA_LABEL_PATTERN.test(device.label)
        );

        return camera?.deviceId ?? null;
      }

      async function initializeVideo() {
        let permissionStream = null;

        try {
          permissionStream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false,
          });

          const oakDeviceId = await findOakCameraDeviceId();
          permissionStream.getTracks().forEach((track) => track.stop());

          const captureConstraints = oakDeviceId
            ? {
                audio: false,
                video: {
                  deviceId: { exact: oakDeviceId },
                  width: 640,
                  height: 480,
                },
              }
            : {
                audio: false,
                video: {
                  width: 640,
                  height: 480,
                },
              };

          cameraStatus = oakDeviceId
            ? 'OAK-D Lite verbunden'
            : 'OAK-D Lite nicht gefunden - Standardkamera aktiv';

          video = createCapture(captureConstraints);
          video.size(640, 480);
          video.hide();
          handPose.detectStart(video, gotHands);
        } catch (error) {
          if (permissionStream) {
            permissionStream.getTracks().forEach((track) => track.stop());
          }
          cameraStatus = 'Kamerazugriff fehlgeschlagen';
          console.error('Kamera konnte nicht initialisiert werden:', error);
        }
      }

      function setup() {
        createCanvas(640, 480);
        waitingStartTime = millis();
        initializeVideo();

        connectBtn = createButton('🔌 ESP32 verbinden');
        connectBtn.mousePressed(connectSerial);
        connectBtn.style('margin-top', '10px');
        connectBtn.style('padding', '8px 16px');
        connectBtn.style('font-size', '15px');
        connectBtn.style('cursor', 'pointer');
        connectBtn.style('border', 'none');
        connectBtn.style('border-radius', '6px');
        connectBtn.style('background', '#444');
        connectBtn.style('color', '#fff');
      }

      function getHandOrientation(hand) {
        let wrist    = hand.keypoints[0];
        let indexMCP = hand.keypoints[5];
        let pinkyMCP = hand.keypoints[17];
        let crossZ = (indexMCP.x - wrist.x) * (pinkyMCP.y - wrist.y)
                   - (indexMCP.y - wrist.y) * (pinkyMCP.x - wrist.x);
        let isRight = hand.handedness === "Left";
        if (isRight) return crossZ > 0 ? "Außenfläche" : "Innenfläche";
        else         return crossZ < 0 ? "Außenfläche" : "Innenfläche";
      }

      // Grüne Pixel zählen und Centroid berechnen
      function detectRechen() {
        video.loadPixels();
        let count = 0;
        let sumX = 0;
        let sumY = 0;

        for (let i = 0; i < video.pixels.length; i += 16) {
          let r = video.pixels[i];
          let g = video.pixels[i + 1];
          let b = video.pixels[i + 2];
          if (g > 100 && g > r * 1.4 && g > b * 1.4 && r < 180 && b < 180) {
            count++;
            let idx = i / 4;
            sumX += idx % video.width;
            sumY += Math.floor(idx / video.width);
          }
        }

        rechenDetected = count >= 15;
        if (rechenDetected) {
          rechenCX = sumX / count;
          rechenCY = sumY / count;
        } else {
          rechenCX = null;
          rechenCY = null;
        }
      }

      let currentAvgMove = 0;

      function updateCentroidHistory() {
        if (!rechenDetected) {
          centroidHistory = [];
          rechenStable = false;
          stillFrames = 0;
          refCX = null;
          refCY = null;
          currentAvgMove = 0;
          return;
        }

        centroidHistory.push({ x: rechenCX, y: rechenCY });
        if (centroidHistory.length > CENTROID_HISTORY_LEN) centroidHistory.shift();
        if (centroidHistory.length < CENTROID_HISTORY_LEN) return;

        let totalMove = 0;
        for (let i = 1; i < centroidHistory.length; i++) {
          let dx = centroidHistory[i].x - centroidHistory[i - 1].x;
          let dy = centroidHistory[i].y - centroidHistory[i - 1].y;
          totalMove += Math.sqrt(dx * dx + dy * dy);
        }
        currentAvgMove = totalMove / (centroidHistory.length - 1);
      }

      function checkRechenLift() {
        if (!rechenDetected || centroidHistory.length < CENTROID_HISTORY_LEN) return false;

        // Fall A: Delay abgelaufen + Rechen bewegt sich → direkt starten
        if (millis() - waitingStartTime > MIN_WAIT_MS && currentAvgMove > STILL_THRESHOLD) {
          return true;
        }

        // Fall B: Rechen liegt still → Referenz setzen, dann auf Bewegung warten
        if (!rechenStable) {
          if (currentAvgMove < STILL_THRESHOLD) {
            stillFrames++;
            if (stillFrames >= STILL_FRAMES_NEEDED) {
              rechenStable = true;
              refCX = rechenCX;
              refCY = rechenCY;
            }
          } else {
            stillFrames = 0;
          }
          return false;
        }

        let dx = rechenCX - refCX;
        let dy = rechenCY - refCY;
        return Math.sqrt(dx * dx + dy * dy) > MOVE_THRESHOLD;
      }

      function draw() {
        background(0);

        if (!video) {
          drawCameraStatus();
          return;
        }

        image(video, 0, 0, width, height);
        detectRechen();
        updateCentroidHistory();

        if (gameState === 'waiting') {
          drawWaitingScreen();
        } else {
          drawPlayingScreen();
        }

        if (serialConnected) {
          noStroke();
          fill(0, 200, 0);
          circle(width - 14, 14, 14);
        }

        if (cameraStatus !== 'OAK-D Lite verbunden') {
          drawCameraStatus();
        }
      }

      function drawCameraStatus() {
        noStroke();
        fill(0, 0, 0, 160);
        rect(0, height - 28, width, 28);
        fill(255);
        textSize(14);
        textAlign(LEFT, CENTER);
        text(cameraStatus, 10, height - 14);
      }

      function drawWaitingScreen() {
        fill(0, 0, 0, 140);
        noStroke();
        rect(0, 0, width, height);

        if (checkRechenLift()) {
          gameState = 'playing';
          centroidHistory = [];
          rechenStable = false;
          stillFrames = 0;
          sendSerial('E');
          return;
        }

        // Centroid + Stabilitätsanzeige (Debug-Hilfe beim Einrichten)
        if (rechenDetected && rechenCX !== null) {
          let col = rechenStable ? color(0, 255, 100) : color(255, 200, 0);
          noFill();
          stroke(col);
          strokeWeight(2);
          circle(rechenCX, rechenCY, 30);
          if (refCX !== null) {
            stroke(255, 80, 80);
            strokeWeight(1);
            line(refCX, refCY, rechenCX, rechenCY);
          }
        }

        // Statustext
        textAlign(CENTER, CENTER);
        noStroke();
        fill(255);
        textSize(28);
        text("Rechen hochheben", width / 2, height / 2 - 20);
        textSize(18);
        fill(200);
        text("um das Spiel zu starten", width / 2, height / 2 + 20);

        // Statusleiste unten
        let statusText;
        let statusColor;
        if (!rechenDetected) {
          statusText = "Kein Rechen erkannt";
          statusColor = color(120, 120, 120, 200);
        } else if (!rechenStable) {
          let progress = Math.round((stillFrames / STILL_FRAMES_NEEDED) * 100);
          statusText = "Rechen erkannt – kurz stillhalten… " + progress + "%";
          statusColor = color(200, 140, 0, 200);
        } else {
          statusText = "Bereit – jetzt hochheben!";
          statusColor = color(0, 180, 0, 200);
        }

        noStroke();
        fill(statusColor);
        rect(0, height - 40, width, 40);
        fill(255);
        textSize(16);
        textAlign(LEFT, CENTER);
        text(statusText, 12, height - 20);
      }

      function drawPlayingScreen() {
        if (rechenDetected) {
          noFill();
          stroke(0, 200, 0);
          strokeWeight(3);
          rect(width - 44, 44, 34, 34, 4);
          fill(0, 200, 0);
          noStroke();
          textSize(22);
          textAlign(CENTER, CENTER);
          text("🟢", width - 27, 61);
        }

        for (let i = 0; i < hands.length; i++) {
          let hand = hands[i];
          let connections = handPose.getConnections();
          for (let j = 0; j < connections.length; j++) {
            let ptA = hand.keypoints[connections[j][0]];
            let ptB = hand.keypoints[connections[j][1]];
            stroke(255, 0, 0);
            strokeWeight(2);
            line(ptA.x, ptA.y, ptB.x, ptB.y);
          }
          for (let j = 0; j < hand.keypoints.length; j++) {
            let kp = hand.keypoints[j];
            fill(0, 255, 0);
            noStroke();
            circle(kp.x, kp.y, 8);
          }
          let orientation = getHandOrientation(hand);
          let wrist = hand.keypoints[0];
          fill(orientation === "Innenfläche" ? color(0, 180, 255) : color(255, 140, 0));
          noStroke();
          rect(wrist.x - 55, wrist.y - 36, 110, 24, 6);
          fill(255);
          textSize(14);
          textAlign(CENTER, CENTER);
          text(orientation, wrist.x, wrist.y - 24);
        }

        let handsDetected = hands.length > 0;
        noStroke();
        fill(handsDetected ? color(0, 200, 0, 180) : color(200, 0, 0, 180));
        rect(0, 0, width, 36);
        fill(255);
        textSize(18);
        textAlign(LEFT, CENTER);
        text(handsDetected ? "Hand(s) erkannt: " + hands.length : "Keine Hand erkannt", 12, 18);

        noStroke();
        fill(rechenDetected ? color(0, 180, 0, 200) : color(80, 80, 80, 180));
        rect(0, 36, width, 36);
        fill(255);
        textSize(18);
        textAlign(LEFT, CENTER);
        text(rechenDetected ? "Rechen erkannt" : "Kein Rechen erkannt", 12, 54);

        let twoHands = hands.length >= 2;
        let now = millis();
        if (twoHands && !prevTwoHands && now - lastCPress > COOLDOWN) {
          lastCPress = now;
          sendSerial('C');
        }
        if (rechenDetected && !prevRechenDetected && now - lastDPress > COOLDOWN) {
          lastDPress = now;
          sendSerial('D');
        }
        prevTwoHands = twoHands;
        prevRechenDetected = rechenDetected;
      }

      function gotHands(results) {
        hands = results;
      }
    </script>
  </body>
</html>
